title = 'MatSch Web'
theme = 'PaperMod'
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = true
enableMissingTranslationPlaceholders = true
enableRobotsTXT = true

[languages]

[languages.de]
title = 'Zwischen Terminal und Trampelpfad'
baseURL = 'https://blog.matschcode.de/de'
label = "Deutsch"
weight = 1
contentDir = "content"

[languages.en]
title = 'Between terminals and trails'
baseURL = 'https://blog.matschcode.de/en'
label = "English"
weight = 2
contentDir = "content"

[outputs]
home = ["HTML", "RSS", "JSON"] # for search

[params]
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowShareButtons = true

  comments = true
  brandSocialImage = "branding/matschcode-jutland-social.webp"
  brandSocialImageWidth = 1200
  brandSocialImageHeight = 630

# Public tracking configuration; emitted only for production builds.
# Keep deployment blocked until the public script and collection endpoint are ready.
[params.analytics.umami]
  enabled = true
  scriptURL = "https://analytics.matschcode.de/script.js"
  websiteID = "1736536a-5b2c-4200-9491-c95f339ca4b2"
  domains = "blog.matschcode.de"

[params.label]
  text = "matschcode"
  wordmark = "branding/matschcode-jutland.svg"

[params.masthead]
  image = "images/masthead.webp"

[params.assets]
  favicon = "branding/jutland-favicon.svg"
  favicon16x16 = "branding/jutland-icon-16.png"
  favicon32x32 = "branding/jutland-icon-32.png"
  apple_touch_icon = "branding/jutland-icon-180.png"
  safari_pinned_tab = "branding/jutland-route.svg"
  css = [
    "css/extended/custom.css",
    "css/extended/sidetoc.css",
    "css/extended/thumbnail.css"
  ]
[params.fuseOpts] # for search
   isCaseSensitive = false
    shouldSort = true
    threshold = 0.25
    minMatchCharLength = 2

[menu]
[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 10
[[menu.main]]
  identifier = "notes"
  name = "Notes"
  url = "/notes/"
  weight = 20
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40
[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 50
