title = 'MatSch Web'
theme = 'PaperMod'
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = true
enableMissingTranslationPlaceholders = true
enableRobotsTXT = true

[languages]

[languages.de]
baseURL = 'https://blog.matschcode.de/de'
label = "Deutsch"
weight = 1
contentDir = "content"

[languages.en]
baseURL = 'https://blog.matschcode.de/en'
label = "English"
weight = 2
contentDir = "content"

[outputs]
home = ["HTML", "RSS", "JSON"] # for search

[params]
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowShareButtons = true

  mainSections = [] # to hide blog posts from main page

  comments = true

[params.masthead]
  image = "images/masthead.webp"

[params.assets]
  css = [
    "css/extended/custom.css",
    "css/extended/sidetoc.css",
    "css/extended/thumbnail.css"
  ]
[params.fuseOpts] # for search
   isCaseSensitive = false
    shouldSort = true
    threshold = 0.25
    minMatchCharLength = 2

[menu]
[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 10
[[menu.main]]
  identifier = "notes"
  name = "Notes"
  url = "/notes/"
  weight = 20
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40
[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 50

